# 每周一自动拉取 awesome 列表的新论文与最新引用数，有变化就提交，GitHub Pages 随之更新
name: Update paper data

on:
  schedule:
    - cron: "0 2 * * 1"   # 每周一 02:00 UTC
  workflow_dispatch:        # 也可以在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch papers and citations
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}   # 可选：在仓库 Secrets 中配置以提高限速
        run: |
          python3 scripts/update_data.py
          python3 scripts/bump_version.py   # 数据变化后更新资源版本号，避免浏览器缓存旧数据
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.js data/cache/s2_cache.json index.html
          git diff --cached --quiet || git commit -m "chore: weekly paper data update"
          git push
